name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: yams_v2_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yams_v2_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Test V2 PostgreSQL migration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/yams_v2_test
        run: npm run test:db
      - run: npm run build
      - run: npm run build:server
